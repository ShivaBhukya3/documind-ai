app:
  name: "DocuMind AI"
  version: "1.0.0"
  description: "Intelligent Document Q&A System powered by RAG & LLMs"
  company: "AI Portfolio Project"

llm:
  provider: "groq"              # groq | openai | huggingface | ollama
  model_name: "llama-3.1-8b-instant"  # fastest groq model
  temperature: 0.1
  max_tokens: 1000
  streaming: true
  fallback_model: "llama-3.1-8b-instant"
  request_timeout: 30
  max_retries: 2

embeddings:
  provider: "fastembed"         # fastembed | openai | huggingface
  model_name: "BAAI/bge-small-en-v1.5"
  fallback: "BAAI/bge-small-en-v1.5"
  dimension: 384
  batch_size: 100
  cache_embeddings: true

vector_store:
  type: "faiss"                 # faiss | pinecone | chroma
  index_path: "data/processed/embeddings/faiss_index"
  similarity_metric: "cosine"
  top_k: 5
  normalize_embeddings: true

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  separators: ["\n\n", "\n", ".", "!", "?", ",", " "]
  length_function: "len"

retrieval:
  search_type: "mmr"            # similarity | mmr | hybrid
  fetch_k: 20
  lambda_mult: 0.5
  score_threshold: 0.3

conversation:
  memory_type: "buffer_window"
  window_size: 10
  max_history: 50
  return_messages: true

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  chunks: "data/processed/chunks"
  embeddings: "data/processed/embeddings"
  logs: "logs"
  models: "models"

logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {message}"
  file: "logs/app.log"
  rotation: "10 MB"
  retention: "7 days"

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1
  rate_limit_per_minute: 10

dashboard:
  port: 8501
  theme: "dark"
  page_title: "DocuMind AI"
  page_icon: "🤖"

evaluation:
  test_set_size: 20
  metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_recall"
    - "context_precision"

supported_file_types:
  - ".pdf"
  - ".docx"
  - ".txt"
  - ".csv"
  - ".pptx"
  - ".md"
  - ".html"

free_mode:
  llm_model: "google/flan-t5-base"
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dimension: 384
