version: "3.8"

services:
  documind-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: documind-dashboard
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  documind-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: documind-api
    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - documind-app
